name: COSMOS Office Preview Checks

on:
  push:
    branches:
      - feature/cosmos-office-maxx-workforce-live-v1
  pull_request:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: cosmos-office-preview-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm install
      - name: Lint
        run: npm run lint
      - name: Production build
        run: npm run build
