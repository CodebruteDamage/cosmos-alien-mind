name: COSMOS Dual-Brain Validation

on:
  pull_request:
    branches: [main]
  push:
    branches: [integration/dual-brain-lifecycle-v1]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm install
      - name: Type check
        run: npm run typecheck
      - name: Lint
        run: npm run lint
      - name: Dual-brain contract tests
        run: npm run test:dual-brain
