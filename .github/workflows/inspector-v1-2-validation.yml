name: COSMOS INSPECTOR v1.2 Validation

on:
  push:
    branches:
      - test/inspector-v1-2-validation
  pull_request:
    branches:
      - main
      - feat/inspector-v1-2-shaped-core

permissions:
  contents: read

jobs:
  inspector-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Run Inspector unit tests
        run: node --test engines/inspector/test/v1.2/*.test.mjs
