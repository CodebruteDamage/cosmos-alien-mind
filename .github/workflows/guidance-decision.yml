name: COSMOS Guidance Decision Checks

on:
  pull_request:
    branches: [main]
  push:
    branches: [feat/guidance-decision-engine-v1]

permissions:
  contents: read

jobs:
  guidance-decision:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm install
      - name: Guidance decision tests
        run: node --experimental-strip-types --test tests/guidance-decision.test.mjs
      - name: Type-check
        run: npx tsc --noEmit
      - name: Lint
        run: npm run lint
      - name: Production build
        run: npm run build
