name: COSMOS Guidance + CRAFT Checks

on:
  pull_request:
    branches: [main, feat/guidance-decision-engine-v1]
  push:
    branches: [feat/guidance-decision-engine-v1, feat/guidance-craft-integration-v1]

permissions:
  contents: read

jobs:
  guidance-craft:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm install
      - name: Guidance and CRAFT tests
        run: node --experimental-strip-types --test tests/*.test.mjs engines/craft/tests/*.test.mjs
      - name: Type-check
        run: npx tsc --noEmit
      - name: Lint
        run: npm run lint
      - name: Production build
        run: npm run build
