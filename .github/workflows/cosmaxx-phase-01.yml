name: COSMAXX Phase 01 Validation

on:
  pull_request:
    branches:
      - cosmaxx/runtime-adapter-v1
      - cosmaxx/phase-01-hardening-v1
      - cosmos/automatic-task-ownership-v1
    paths:
      - 'lib/cosmaxx/**'
      - 'lib/orchestration/**'
      - 'tests/cosmaxx/**'
      - 'docs/task-ownership/**'
      - 'tsconfig.cosmaxx-tests.json'
      - 'package.json'
      - '.github/workflows/cosmaxx-phase-01.yml'
  push:
    branches:
      - cosmaxx/phase-01-hardening-v1

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: COSMAXX contract tests
        run: npm run test:cosmaxx
      - name: TypeScript
        run: npm run typecheck
      - name: ESLint
        run: npm run lint
      - name: Production build
        run: npm run build
