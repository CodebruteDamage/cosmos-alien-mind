name: COSMOS Skill Registry Validation

on:
  pull_request:
    paths:
      - "schemas/skill-manifest.v1.schema.json"
      - "registry/skills/**"
      - "tests/skill_registry/**"
      - ".github/workflows/cosmos-skill-registry-validation.yml"
  push:
    branches:
      - "feature/cosmos-l4-skill-ecosystem-v1"

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install JSON Schema validator
        run: python -m pip install --disable-pip-version-check jsonschema==4.23.0
      - name: Validate registry JSON against manifest schema
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          from jsonschema import Draft202012Validator
          schema = json.loads(Path("schemas/skill-manifest.v1.schema.json").read_text())
          Draft202012Validator.check_schema(schema)
          registry = json.loads(Path("registry/skills/registry.seed.v1.json").read_text())
          assert registry["execution_enabled"] is False
          assert registry["policy_enforcement"] == "WARP_GATE_REQUIRED"
          print("Schema structure valid; registry remains non-executable.")
          PY
      - name: Run registry policy tests
        run: python -m unittest discover -s tests/skill_registry -v
