name: COSMOS Runtime Validation

on:
  push:
    branches:
      - "cosmos/unified-runtime-v1"
  pull_request:
    branches:
      - main

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm install
      - run: node --test android-bridge/tests/*.test.mjs lib/runtime/tests/*.test.mjs
      - run: npm run lint
      - run: npm run build
        env:
          DATABASE_URL: postgresql://ci:ci@localhost:5432/cosmos
          OPENAI_API_KEY: ci-placeholder-not-used-at-build
          BRIDGE_SHARED_SECRET: ci-placeholder-secret-at-least-32-characters
