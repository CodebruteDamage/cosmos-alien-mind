name: COSMOS OmniBoard Foundation Checks

on:
  push:
    branches:
      - feat/cosmos-omniboard-transformation-v1
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  app-checks:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm install
      - name: Lint
        run: npm run lint
      - name: Build
        run: npm run build
