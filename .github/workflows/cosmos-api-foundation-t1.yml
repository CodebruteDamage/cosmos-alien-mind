name: COSMOS API Foundation and Security

on:
  push:
    branches:
      - feat/cosmos-api-foundation-t1
      - feat/cosmos-api-security-t2
      - feat/cosmos-better-auth-t3
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  foundation-checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install --no-audit --no-fund
      - run: npm run lint
      - run: npm run test:cosmos
      - run: npm run typecheck
      - run: npm run build
