name: COSMOS API Foundation T1

on:
  push:
    branches:
      - feat/cosmos-api-foundation-t1
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  foundation-checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm install --no-audit --no-fund
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run build
